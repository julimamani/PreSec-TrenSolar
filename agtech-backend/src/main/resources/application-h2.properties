# Perfil opcional para usar H2 en memoria en lugar de MySQL.
# Activarlo con: SPRING_PROFILES_ACTIVE=h2
# o: ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
spring.datasource.url=${DB_URL:jdbc:h2:mem:presec;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

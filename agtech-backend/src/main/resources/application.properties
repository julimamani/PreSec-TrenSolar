spring.application.name=agtech-backend

# application.properties
server.port=8081

# Load a local .env file when present (REMARKETS_USER=..., REMARKETS_PASSWORD=...).
spring.config.import=optional:file:./.env[.properties]

# Exchange-rate provider (no key required)
api.dolar.url=${DOLAR_API_URL:https://dolarapi.com/v1/dolares}

# Cámara Arbitral de Cereales (BCR Rosario): poroto board price in ARS/t.
# The endpoint is not a versioned API; when it is unavailable or the shape
# changes, the market service falls back to the configured regional spot.
api.cac.pizarra-url=${CAC_PIZARRA_URL:https://www.cac.bcr.com.ar/es/precios-pizarra/consultas}

# Matba Rofex Primary API (reMarkets demo environment).
# Fill the user/password/account delivered by Primary in agtech-backend/.env (gitignored)
# or in the environment. If they are missing, the market service uses the fallbacks.
api.remarkets.base-url=${REMARKETS_BASE_URL:https://api.remarkets.primary.com.ar}
api.remarkets.user=${REMARKETS_USER:}
api.remarkets.password=${REMARKETS_PASSWORD:}
api.remarkets.account=${REMARKETS_ACCOUNT:}
api.remarkets.token-ttl=${REMARKETS_TOKEN_TTL:24h}

# Ordered list of nearby futures per grain. Separate alternatives with commas;
# the first contract with a Last Price (LA) or settlement price (SE) is used.
api.remarkets.symbols.soja=${REMARKETS_SOJA_SYMBOLS:SOJ.ROS/ENE27,SOJ.ROS/FEB27}
api.remarkets.symbols.trigo=${REMARKETS_TRIGO_SYMBOLS:TRI.ROS/ENE27,TRI.BUE/ENE27}
api.remarkets.symbols.maiz=${REMARKETS_MAIZ_SYMBOLS:MAI.ROS/DIC26,MAI.ROS/ABR27}

# Base de datos principal: MySQL. La base debe existir previamente (ver
# agtech-backend/README.md). Para usar H2 en memoria (sin instalar nada),
# activá el perfil "h2".
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/presec_trensolar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

app.storage.location=${FILE_STORAGE_LOCATION:uploads}
app.storage.public-path=/uploads

app.vision-ai.base-url=${VISION_AI_BASE_URL:http://localhost:8000}
app.vision-ai.predict-path=/api/predict
app.vision-ai.connect-timeout=2s
app.vision-ai.read-timeout=30s

# Hybrid market agent: Matba Rofex + DolarAPI + regional bean spot.
# Cache TTL must stay at 15 minutes or more to avoid unnecessary API calls.
app.market.series-limit=${MARKET_SERIES_LIMIT:90}
app.market.cache-ttl=${MARKET_CACHE_TTL:15m}
app.market.connect-timeout=${MARKET_CONNECT_TIMEOUT:3s}
app.market.read-timeout=${MARKET_READ_TIMEOUT:12s}
app.market.provider=${MARKET_PROVIDER:Matba Rofex + DolarAPI + spot regional}
app.market.attribution=${MARKET_ATTRIBUTION:Commodities: Matba Rofex · Tipo de cambio: DolarAPI · Poroto: spot regional}
app.market.quality-premium-rate=${MARKET_QUALITY_PREMIUM_RATE:0.04}
app.market.poroto-spot-usd=${POROTO_SPOT_USD:1250.00}
app.market.soja-fallback-usd=${SOJA_FALLBACK_USD:450.00}
app.market.maiz-fallback-usd=${MAIZ_FALLBACK_USD:200.00}
app.market.trigo-fallback-usd=${TRIGO_FALLBACK_USD:220.00}
app.market.usd-ars-fallback=${USD_ARS_FALLBACK:1500.00}

# Financial agent: percentage of the defective tonnage assumed lost/penalized
app.financial.penalty-factor=${FINANCIAL_PENALTY_FACTOR:0.60}

# Comma-separated frontend origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Muestra las sentencias SQL en el log
logging.level.org.hibernate.SQL=DEBUG

# Muestra los valores de los parámetros pasados a las consultas (?)
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Formatea el SQL para que sea legible en múltiples líneas
spring.jpa.properties.hibernate.format_sql=true

# Resalta las palabras clave de SQL con colores en la consola
spring.jpa.properties.hibernate.highlight_sql=true


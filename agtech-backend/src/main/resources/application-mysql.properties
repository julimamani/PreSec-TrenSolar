# Perfil opcional para usar MySQL en lugar de H2.
# Activarlo con: SPRING_PROFILES_ACTIVE=mysql
# o: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/presec_trensolar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Perfil opcional para usar PostgreSQL en lugar de H2.
# Activarlo con: SPRING_PROFILES_ACTIVE=postgres
# o: ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/presec_trensolar}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

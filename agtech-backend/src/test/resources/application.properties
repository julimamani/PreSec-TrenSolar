# Los tests usan siempre H2 en memoria; no requieren MySQL.
spring.datasource.url=jdbc:h2:mem:presec_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.storage.location=target/test-uploads
app.storage.public-path=/uploads
